name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pyflakes
      - run: python -m pyflakes safety.py
      - run: python -m py_compile voice.py tts.py safety.py
      - run: pytest -q
